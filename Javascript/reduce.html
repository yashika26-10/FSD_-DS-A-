<body>
    <script>
          const num=[11,22,33,41,5,60,70];
        const even=num.filter((i)=>(i%2==0));
        // console.log(even);
         const square=even.map((i)=>(i*i));
        //  console.log(square);
        const sum=square.reduce((i,s)=>(i+s));
        console.log(sum);
    </script>
